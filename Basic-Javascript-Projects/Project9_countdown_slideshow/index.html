<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="CSS/main.css">
    <script src="JS/main.js" defer></script>
    <title>Slideshow Countdown</title>
</head>

<body>
    <!--COUNTDOWN-->
    <p>How many seconds would you like to set your alarm for</p>
    <input id="seconds" value="" />
    <button onclick="countdown()">Click here</button>
    <p id="timer"></p>

    <!--SlIDESHOW-->
    <div class="slideshow-container">

        <!--FIRST SLIDE-->
        <div class="mySlides">
            <div class="slide-text">1 / 3</div>
            <img src="images/car1.jpg" alt="First car image">
            <div class="slide-caption">Blue old car</div>
        </div>

        <!--SECOND SLIDE-->
        <div class="mySlides">
            <div class="slide-text">2 / 3</div>
            <img src="images/car2.jpg" alt="Second car image">
            <div class="slide-caption">Black old car</div>
        </div>

        <!--THIRD SLIDE-->
        <div class="mySlides">
            <div class="slide-text">3 / 3</div>
            <img src="images/car3.jpg" alt="Third car image">
            <div class="slide-caption">Red old car</div>
        </div>

        <!--SLIDESHOW NAVIGATION-->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>

    <!--SLIDESHOW DOTS-->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
    </div>

</body>

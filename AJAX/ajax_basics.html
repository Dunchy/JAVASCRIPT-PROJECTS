<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Basic AJAX Demo</title>
	<link rel="stylesheet" href="style.css">

</head>

<body>
	<div class='container' id="content">
		<h1>Sign up for our Newsletter</h1>
		<div class="display">
			<form>
				<!--Form for inputing name and email-->
				<input id="fullName" placeholder="Name">
				<input placeholder="Email">
				<!--Submit button will call the getMsg function from ajax_basics.html-->
				<input type="button" class="btn" value="Submit" onclick="getMsg();"/>
			</form>
		</div>
	</div>
	<!--link for the JavaScript file at the end to make sure everything else has loaded first-->
	<script src="ajaxScript.js"></script>
</body>
</html>
